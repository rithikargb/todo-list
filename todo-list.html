<!DOCTYPE html>
<html>
  <head>
    <title>To-do</title>
    <link rel="stylesheet" href="styles/todo-list.css">
  </head>

  <body>
    <p style="font-family: Arial;">Todo List</p>

    <div class="todo-input-grid">
      <input class="js-input input" placeholder="Todo name" 
        onkeydown="handleKeydown(event)">
      <input type="date" class="js-date-input date-input"
        onkeydown="handleKeydown(event)">
      <button class="add" onclick="
        addTodo();
      ">Add</button>
    </div>
      
    <div class="js-todo-list todo-grid"></div>

    <script src="scripts/todo-list.js"></script>
  </body>
</html>
